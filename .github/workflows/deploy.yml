name: Deploy site and refresh current affairs

# Runs on every push, and every 3 hours to refresh the last-24h news feeds.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Google News feeds (last 24 hours)
        run: python scripts/fetch_news.py
        continue-on-error: true
        timeout-minutes: 7
      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html icon.svg manifest.webmanifest css js _site/
          [ -d news ] && cp -r news _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
