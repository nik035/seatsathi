name: Health check (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          mkdir -p out
          K=$(grep -oP 'apiKey:\s*"\K[^"]+' js/config.js); P=$(grep -oP 'projectId:\s*"\K[^"]+' js/config.js)
          B="https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents"
          {
            echo "== libraries (public read)"; curl -s -o /tmp/a -w "%{http_code}\n" "$B/libraries?key=$K&pageSize=5"; head -c 600 /tmp/a; echo
            echo "== users (must be denied)"; curl -s -o /tmp/a -w "%{http_code}\n" "$B/users?key=$K&pageSize=1"; head -c 300 /tmp/a; echo
            echo "== memberships (must be denied)"; curl -s -o /tmp/a -w "%{http_code}\n" "$B/memberships?key=$K&pageSize=1"; head -c 300 /tmp/a; echo
            echo "== seats collection group (public read)"; curl -s -o /tmp/a -w "%{http_code}\n" -H 'Content-Type: application/json' -d '{"structuredQuery":{"from":[{"collectionId":"seats","allDescendants":true}],"limit":3}}' "$B:runQuery?key=$K"; head -c 400 /tmp/a; echo
            echo "== google sign-in + authorized domain"; curl -s -o /tmp/a -w "%{http_code}\n" -H 'Content-Type: application/json' -d '{"providerId":"google.com","continueUri":"https://nik035.github.io/seatsathi/"}' "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$K"; head -c 400 /tmp/a; echo
            echo "== unauthorized-domain control"; curl -s -o /tmp/a -w "%{http_code}\n" -H 'Content-Type: application/json' -d '{"providerId":"google.com","continueUri":"https://example.org/"}' "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$K"; head -c 300 /tmp/a; echo
          } > out/probe.txt 2>&1
          cat > /tmp/live.py <<'PY'
          import asyncio, json, traceback
          from playwright.async_api import async_playwright
          res = {}
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for name, w, h in [("desktop", 1280, 900), ("phone", 390, 844)]:
                      ctx = await b.new_context(viewport={"width": w, "height": h})
                      pg = await ctx.new_page()
                      errs = []
                      pg.on("pageerror", lambda e, errs=errs: errs.append("PAGEERR " + str(e)))
                      pg.on("console", lambda m, errs=errs: errs.append(f"{m.type}: {m.text}") if m.type in ("error", "warning") else None)
                      for route in ["#/", "#/find", "#/news", "#/login?as=owner"]:
                          key = f"{name} {route}"
                          try:
                              await pg.goto("https://nik035.github.io/seatsathi/" + route, wait_until="load", timeout=30000)
                              await pg.wait_for_timeout(4000)
                              res[key] = {"text": (await pg.inner_text("#main"))[:300], "demoBanner": await pg.is_visible("#demo-flag")}
                              fn = route.strip("#/").replace("/", "_").replace("?", "_").replace("=", "-") or "home"
                              await pg.screenshot(path=f"out/{name}-{fn}.png", full_page=(name == "desktop"))
                          except Exception as e:
                              res[key] = "FAILED " + repr(e)[:300]
                      if name == "desktop":
                          try:
                              async with ctx.expect_page(timeout=10000) as popinfo:
                                  await pg.click("#g-btn")
                              pop = await popinfo.value
                              await pop.wait_for_timeout(4000)
                              res["google popup url"] = pop.url[:160]
                              res["google popup text"] = (await pop.inner_text("body"))[:300]
                              await pop.close()
                          except Exception as e:
                              res["google popup"] = "no popup: " + repr(e)[:200]
                          await pg.wait_for_timeout(1500)
                          res["toast after google click"] = await pg.inner_text("#toast") if await pg.query_selector("#toast") else ""
                      res[name + " errors"] = errs[:20]
                      await ctx.close()
                  await b.close()
          try:
              asyncio.run(main())
          except Exception:
              res["CRASH"] = traceback.format_exc()[-1500:]
          json.dump(res, open("out/live.json", "w"), indent=1, ensure_ascii=False)
          PY
          python /tmp/live.py || echo "live test crashed" >> out/probe.txt
      - name: Save results to branch
        run: |
          git config user.name "seatsathi-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan healthcheck-results; git rm -rfq . ; git add -f out; git commit -qm "health check results"
          git push -f origin healthcheck-results
